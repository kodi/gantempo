[tools]
node = "24"

[env]
_.path = ["./node_modules/.bin"]

[tasks.install]
description = "Install workspace dependencies through Vite+"
run = "vp install"

[tasks.check]
description = "Run formatting, linting, and type checking"
run = "vp check"

[tasks.test]
description = "Run the test suite once"
run = "vp test run"

[tasks.build]
description = "Bundle the library with tsdown"
run = "vp pack"

[tasks.ci]
description = "Run all local CI checks"
depends = ["check", "test", "build"]
